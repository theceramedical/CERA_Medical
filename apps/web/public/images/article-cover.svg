<?xml version="1.0" encoding="UTF-8"?>
<!--
  A placeholder for an article cover, pending CERA's own imagery (PRD 22).

  16:9 at the same 640x360 the component declares, so the box reserved for it matches the real cover and
  swapping the file in changes no layout.

  One file for all three cards, which is honest about it being a placeholder: three different
  placeholders would look like a design decision. Phase 05 gives each article its own cover from the
  CMS.

  Literal hex rather than tokens, because a file in `public/` never passes through Tailwind. Copied
  from theme.css (`surface-tint-2`, `primary-200`).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Placeholder image">
  <rect width="640" height="360" fill="#e6f2fa" />

  <g fill="none" stroke="#a8d3ea" stroke-width="3" stroke-linecap="round">
    <path d="M120 250h400" />
    <path d="M180 250l70-90 55 62 45-52 70 80" />
    <circle cx="430" cy="130" r="22" />
  </g>
</svg>
