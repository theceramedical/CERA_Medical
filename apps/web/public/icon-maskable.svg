<?xml version="1.0" encoding="UTF-8"?>
<!--
  The maskable icon, for a home-screen install.

  A maskable icon is cropped by the platform to whatever shape it uses - a circle on some Android
  launchers, a squircle on others - and the crop is not gentle: the specification guarantees only the
  central 80% circle survives, so anything outside it may be cut.

  So this is the same mark as `app/icon.svg`, scaled to 60% and centred, on a full-bleed navy field.
  The generous padding is the entire difference between the two files, and it is why this cannot be the
  same file declared with a second `purpose` - an icon padded for masking looks lost everywhere else.

  Literal hex for the same reason as `icon.svg`: a file fetched directly by the browser never sees
  Tailwind. `#0a5378` is `primary-700` and `#ffffff` is `neutral-0`, both from theme.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" fill="#0a5378" />

  <!-- 40x40 source scaled by 2.4 to 96px and centred, which places every path inside the 80% safe
       circle regardless of the shape the launcher crops to. -->
  <g transform="translate(48 48) scale(2.4)" fill="#ffffff">
    <path
      opacity="0.25"
      d="M15.5 4h9a2 2 0 0 1 2 2v9.5H36a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9.5V38a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9.5H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h9.5V6a2 2 0 0 1 2-2Z"
    />
    <path
      d="M16.75 7h6.5a1 1 0 0 1 1 1v9.75H34a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1h-9.75V36a1 1 0 0 1-1 1h-6.5a1 1 0 0 1-1-1v-9.75H6a1 1 0 0 1-1-1v-6.5a1 1 0 0 1 1-1h9.75V8a1 1 0 0 1 1-1Z"
    />
    <path
      d="M26 14.5c0-5.25 3.9-9.7 9.4-11.4.7-.2 1.4.4 1.3 1.1-.7 6-4.2 10.3-9.1 11.6a1 1 0 0 1-1.2-.7 5.6 5.6 0 0 1-.4-.6Z"
    />
    <path
      opacity="0.6"
      d="M27.4 15.3c1.4-3.7 4-6.6 7.4-8.2.5-.2 1 .4.6.8-2.6 2.4-4.6 5-6 8a.8.8 0 0 1-1.5-.6Z"
    />
  </g>
</svg>
