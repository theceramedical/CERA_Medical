<?xml version="1.0" encoding="UTF-8"?>
<!--
  The favicon and app icon: the cross-and-leaf mark on a white field.

  The same four paths as `CrossAndLeaf` in `@cera/ui/wordmark`, with `currentColor` resolved to
  `primary-700` (#0a5378 in theme.css). They have to be literal here: an icon file is fetched directly by
  the browser, never rendered by React and never passed through Tailwind, so neither the component nor
  the token is reachable from it.

  That duplication is the one real cost, and it is why this comment names the source. If the mark
  changes, both change.

  `app/icon.svg` rather than `public/favicon.ico`: Next serves this as the icon for every route and emits
  the `<link rel="icon">` itself, so there is no tag to forget and no `.ico` to regenerate at four sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- A white field. Without it the mark is drawn on whatever the browser puts behind a favicon, which
       in a dark browser theme is dark - and a navy mark on a dark tab strip is invisible. -->
  <rect width="40" height="40" rx="8" fill="#ffffff" />

  <path
    fill="#0a5378"
    opacity="0.18"
    d="M15.5 4h9a2 2 0 0 1 2 2v9.5H36a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9.5V38a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9.5H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h9.5V6a2 2 0 0 1 2-2Z"
  />
  <path
    fill="#0a5378"
    d="M16.75 7h6.5a1 1 0 0 1 1 1v9.75H34a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1h-9.75V36a1 1 0 0 1-1 1h-6.5a1 1 0 0 1-1-1v-9.75H6a1 1 0 0 1-1-1v-6.5a1 1 0 0 1 1-1h9.75V8a1 1 0 0 1 1-1Z"
  />
  <path
    fill="#0a5378"
    d="M26 14.5c0-5.25 3.9-9.7 9.4-11.4.7-.2 1.4.4 1.3 1.1-.7 6-4.2 10.3-9.1 11.6a1 1 0 0 1-1.2-.7 5.6 5.6 0 0 1-.4-.6Z"
  />
  <path
    fill="#0a5378"
    opacity="0.55"
    d="M27.4 15.3c1.4-3.7 4-6.6 7.4-8.2.5-.2 1 .4.6.8-2.6 2.4-4.6 5-6 8a.8.8 0 0 1-1.5-.6Z"
  />
</svg>
