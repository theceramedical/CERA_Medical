# Production edge overlay. Applications are in compose.application.yaml.
services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      CERA_DOMAIN: ${CERA_DOMAIN:?CERA_DOMAIN required}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [cera-public]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

volumes:
  caddy-data:
  caddy-config:
