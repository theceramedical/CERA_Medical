# =============================================================================
# CERA Medical - base Compose file
# =============================================================================
# This file is production-safe by default. Development conveniences (host port
# publishing, bind mounts, MinIO, Mailpit) live in the local overlay so they
# cannot leak into a deployed environment:
#
#   local       docker compose -f compose.yaml -f infra/compose/compose.local.yaml up -d
#   staging     docker compose -f compose.yaml -f infra/compose/compose.staging.yaml up -d
#   production  docker compose -f compose.yaml -f infra/compose/compose.production.yaml up -d
#
# Two networks. `cera-private` is internal, so PostgreSQL and Valkey have no
# route off the host regardless of overlay (PRD INF-901).
# =============================================================================

name: cera

networks:
  cera-public:
    driver: bridge
  cera-private:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  valkey-data:

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18
  # The volume mounts at /var/lib/postgresql, the PARENT of PGDATA. Postgres 18
  # moved PGDATA into a version-specific subdirectory, which is what makes a
  # later `pg_upgrade --link` fast. Mounting the child path breaks that.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Consumed by the init script to create the five databases and roles.
      CERA_APP_DB: ${CERA_APP_DB:-cera_app}
      CERA_APP_DB_USER: ${CERA_APP_DB_USER:-cera_app}
      CERA_APP_DB_PASSWORD: ${CERA_APP_DB_PASSWORD:?required}
      CERA_CMS_DB: ${CERA_CMS_DB:-cera_cms}
      CERA_CMS_DB_USER: ${CERA_CMS_DB_USER:-cera_cms}
      CERA_CMS_DB_PASSWORD: ${CERA_CMS_DB_PASSWORD:?required}
      CERA_COMMERCE_DB: ${CERA_COMMERCE_DB:-cera_commerce}
      CERA_COMMERCE_DB_USER: ${CERA_COMMERCE_DB_USER:-cera_commerce}
      CERA_COMMERCE_DB_PASSWORD: ${CERA_COMMERCE_DB_PASSWORD:?required}
      AUTHENTIK_DB: ${AUTHENTIK_DB:-authentik}
      AUTHENTIK_DB_USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?required}
      GLITCHTIP_DB: ${GLITCHTIP_DB:-glitchtip}
      GLITCHTIP_DB_USER: ${GLITCHTIP_DB_USER:-glitchtip}
      GLITCHTIP_DB_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cera-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Valkey 9 - BullMQ queues, rate limiting, catalogue cache.
  # AOF is enabled because queue state matters. Even so, the outbox sweep in
  # apps/worker means a total Valkey loss costs latency, not data.
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    command: >
      valkey-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - valkey-data:/data
    networks:
      - cera-private
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
