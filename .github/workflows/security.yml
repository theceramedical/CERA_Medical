name: Security

# Implements the PRD 10 supply-chain and secret-handling controls. Runs on every
# pull request and on a weekly schedule, because a dependency that was clean on
# merge day does not stay clean.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 03:17 UTC. Off the hour deliberately: scheduled runs cluster on
    # the hour across GitHub and get queued.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "10.28.2"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. A secret committed three commits ago and "removed" in
          # the next one is still in the repository, and a shallow clone misses it.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Audit for high and critical advisories
        # Only high and critical fail the build. Failing on every low-severity
        # advisory in a transitive dev dependency trains people to ignore this
        # job, which is worse than not running it.
        # GHSA-vfj7-8cjw-p6xm currently has no patched braces release. Its path is
        # Payload -> Sass -> chokidar; retain the exception here until upstream fixes it.
        run: pnpm audit --audit-level high --prod --ignore GHSA-vfj7-8cjw-p6xm

      - name: Report all advisories without failing
        if: always()
        run: pnpm audit --json > pnpm-audit.json || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit
          path: pnpm-audit.json
          retention-days: 30
          if-no-files-found: ignore

  actions-pinning:
    name: Verify actions are SHA-pinned
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject tag references
        # A tag is mutable, so a pinned-by-tag action is not pinned at all. This
        # check is what stops the pinning discipline decaying one PR at a time.
        run: |
          set -uo pipefail
          violations=$(grep -rEn '^\s*(-\s+)?uses:\s+[^#]*@(v[0-9]|main|master|latest)' \
            .github/workflows/ || true)
          if [ -n "$violations" ]; then
            echo "::error::These action references use a mutable tag instead of a commit SHA:"
            echo "$violations"
            exit 1
          fi
          echo "All action references are pinned to a commit SHA."
