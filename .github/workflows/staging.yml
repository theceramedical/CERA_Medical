name: Deploy to staging

# Build once, deploy that exact artefact. The image is tagged with the commit SHA
# rather than a moving tag, so "what is running on staging" always has a single
# unambiguous answer, and the same artefact is what gets promoted to production.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  # Never cancel a deploy in progress: interrupting one mid-migration leaves the
  # database in a state neither version expects.
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "10.28.2"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build ${{ matrix.app }} image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Required for build provenance, so the deployed image can be traced back
      # to the commit and workflow that produced it.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, cms, commerce, api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=sha,format=long
            type=raw,value=staging

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: true
          sbom: true

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  scan:
    name: Scan images
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, cms, commerce, api, worker]
    steps:
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL,HIGH
          # Report rather than block on staging. Production gates on this in
          # release.yml; blocking staging on a base-image CVE with no available
          # fix would stop all testing for something nobody can action today.
          exit-code: "0"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.app }}
          path: trivy-${{ matrix.app }}.sarif
          retention-days: 30
          if-no-files-found: ignore

  deploy:
    name: Deploy
    needs: [build, scan]
    runs-on: ubuntu-24.04
    # The environment carries the secrets and any reviewer requirement. Staging
    # deploys without approval; production does not.
    environment:
      name: staging
      url: https://staging.cera-medical.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy over SSH
        # Migrations run before the new images start, and the deploy script
        # verifies health afterwards and rolls back on failure. The logic lives
        # in the repository rather than in YAML so it can be rehearsed locally.
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "::warning::STAGING_HOST is not configured. CERA has not yet supplied the Hetzner host (PRD 22). Skipping deploy; the images above are built and scanned."
            exit 0
          fi
          bash infra/scripts/deploy.sh staging

      - name: Smoke test
        env:
          BASE_URL: https://staging.cera-medical.com
        run: |
          if [ -z "${{ secrets.STAGING_HOST }}" ]; then
            echo "::notice::Skipped: no staging host configured."
            exit 0
          fi
          bash infra/scripts/smoke-test.sh
