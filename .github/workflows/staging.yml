name: Deploy to staging

# Stage-specific public URLs are baked into the image. Immutable commit tags are
# resolved to digests by the host deployment script.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  # Never cancel a deploy in progress: interrupting one mid-migration leaves the
  # database in a state neither version expects.
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "10.28.2"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check staging build URLs
        env:
          SITE_URL: ${{ vars.STAGING_SITE_URL }}
          API_URL: ${{ vars.STAGING_API_URL }}
          CMS_URL: ${{ vars.STAGING_CMS_URL }}
          MEDIA_URL: ${{ vars.STAGING_MEDIA_URL }}
        run: |
          for name in SITE_URL API_URL CMS_URL MEDIA_URL; do
            test -n "${!name:-}" || { echo "::error::Missing staging $name"; exit 1; }
          done

  build:
    name: Build ${{ matrix.app }} image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Required for build provenance, so the deployed image can be traced back
      # to the commit and workflow that produced it.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, cms, commerce, api, worker, migrator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: namespace
        name: Normalize image namespace
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.namespace.outputs.prefix }}/${{ matrix.app }}
          tags: |
            type=raw,value=staging-sha-${{ github.sha }}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./infra/docker/Dockerfile
          build-args: |
            APP=${{ matrix.app }}
            BUILD_SITE_URL=${{ vars.STAGING_SITE_URL }}
            BUILD_API_URL=${{ vars.STAGING_API_URL }}
            BUILD_CMS_URL=${{ vars.STAGING_CMS_URL }}
            BUILD_MEDIA_URL=${{ vars.STAGING_MEDIA_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: true
          sbom: true

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.namespace.outputs.prefix }}/${{ matrix.app }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  scan:
    name: Scan images
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, cms, commerce, api, worker, migrator]
    steps:
      - id: namespace
        name: Normalize image namespace
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.namespace.outputs.prefix }}/${{ matrix.app }}:staging-sha-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL,HIGH
          # Report rather than block on staging. Production gates on this in
          # release.yml; blocking staging on a base-image CVE with no available
          # fix would stop all testing for something nobody can action today.
          exit-code: "0"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.app }}
          path: trivy-${{ matrix.app }}.sarif
          retention-days: 30
          if-no-files-found: ignore

  deploy:
    name: Deploy
    needs: [build, scan]
    runs-on: ubuntu-24.04
    # The environment carries the secrets and any reviewer requirement. Staging
    # deploys without approval; production does not.
    environment:
      name: staging
      url: https://staging.cera-medical.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          IMAGE_TAG: staging-sha-${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "::error::$name is required"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          tar -cf - compose.yaml infra/compose infra/caddy infra/postgres infra/scripts infra/systemd | \
            ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/cera && tar -xf - -C /opt/cera'
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/cera && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' bash infra/scripts/deploy.sh staging"

      - name: Smoke test
        env:
          SMOKE_ORIGIN: ${{ vars.STAGING_SITE_URL }}
          SMOKE_API: ${{ vars.STAGING_API_URL }}
        run: bash infra/scripts/smoke-test.sh
