name: Release to production

# Manually started by the repository owner from main. The current GitHub plan
# does not support required reviewers for this private repository's environment.
#
# Production uses its own build because public URLs are compiled into Next.js.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "10.28.2"

jobs:
  verify:
    name: Full verification
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: cera_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]
      valkey:
        image: valkey/valkey:9.1.2-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:ci_only_not_a_real_secret@localhost:5432/cera_test
      VALKEY_URL: redis://localhost:6379/0
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared runtime packages
        run: pnpm --filter '@cera/observability...' build
      - run: pnpm lint
      - run: pnpm typecheck
      # The @cera/db integration suite asserts constraints and triggers against
      # a real schema. Match ci.yml by migrating the isolated CI database first.
      - name: Apply database migrations
        run: pnpm migrate
      - run: pnpm test
      - name: Check production build URLs
        env:
          SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          CMS_URL: ${{ vars.PRODUCTION_CMS_URL }}
          MEDIA_URL: ${{ vars.PRODUCTION_MEDIA_URL }}
        run: |
          for name in SITE_URL API_URL CMS_URL MEDIA_URL; do
            test -n "${!name:-}" || { echo "::error::Missing production $name"; exit 1; }
          done

      - name: Check migration snapshots
        run: pnpm migrate:drift

  build:
    name: Build production image ${{ matrix.app }}
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, cms, commerce, api, worker, migrator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: namespace
        name: Normalize image namespace
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./infra/docker/Dockerfile
          push: true
          tags: ${{ steps.namespace.outputs.prefix }}/${{ matrix.app }}:production-sha-${{ github.sha }}
          build-args: |
            APP=${{ matrix.app }}
            BUILD_SITE_URL=${{ vars.PRODUCTION_SITE_URL }}
            BUILD_API_URL=${{ vars.PRODUCTION_API_URL }}
            BUILD_CMS_URL=${{ vars.PRODUCTION_CMS_URL }}
            BUILD_MEDIA_URL=${{ vars.PRODUCTION_MEDIA_URL }}
          cache-from: type=gha,scope=production-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.app }}
          provenance: true
          sbom: true
  security-gate:
    name: Security gate ${{ matrix.app }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: true
      matrix:
        app: [web, cms, commerce, api, worker, migrator]
    steps:
      - id: namespace
        name: Normalize image namespace
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.namespace.outputs.prefix }}/${{ matrix.app }}:production-sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Deploy to production
    needs: [verify, security-gate]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.PRODUCTION_SITE_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          DEPLOY_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: production-sha-${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "::error::$name is required"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cleanup_registry_auth() {
            ssh "$DEPLOY_USER@$DEPLOY_HOST" 'docker logout ghcr.io >/dev/null 2>&1 || true'
          }
          trap cleanup_registry_auth EXIT
          printf '%s' "$DEPLOY_GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"
          tar -cf - compose.yaml infra/compose infra/caddy infra/postgres infra/erpnext infra/scripts infra/systemd | \
            ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/cera && tar -xf - -C /opt/cera'
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/cera && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' bash infra/scripts/deploy.sh production"
      - name: Smoke test
        env:
          SMOKE_ORIGIN: ${{ vars.PRODUCTION_SITE_URL }}
          SMOKE_API: ${{ vars.PRODUCTION_API_URL }}
        run: bash infra/scripts/smoke-test.sh
