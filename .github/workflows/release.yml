name: Release to production

# Manually started by the repository owner from main. The current GitHub plan
# does not support required reviewers for this private repository's environment.
#
# Production uses its own build because public URLs are compiled into Next.js.
#
# Verification: requires a successful CI run on the same commit (see ci.yml).
# Images: path filters rebuild only affected apps; deploy reuses prior digests
# for skipped apps (see CERA_PULL_APPS in deploy.sh).

on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Build and scan all images (ignore path filters)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "10.28.2"

jobs:
  preflight:
    name: Release preflight
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
            --jq '.workflow_runs[] | select(.name == "CI" and .head_branch == "main") | .conclusion' | head -1)"
          if [[ "$conclusion" != success ]]; then
            echo "::error::CI must succeed on ${GITHUB_SHA} before production release (latest CI conclusion: ${conclusion:-none}). Push to main and wait for CI, or fix failures."
            exit 1
          fi
          echo "CI succeeded on ${GITHUB_SHA}"

      - name: Check production build URLs
        env:
          SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          CMS_URL: ${{ vars.PRODUCTION_CMS_URL }}
          MEDIA_URL: ${{ vars.PRODUCTION_MEDIA_URL }}
        run: |
          for name in SITE_URL API_URL CMS_URL MEDIA_URL; do
            test -n "${!name:-}" || { echo "::error::Missing production $name"; exit 1; }
          done

  changes:
    name: Detect image changes
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      pull_apps: ${{ steps.plan.outputs.pull_apps }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - id: diff_base
        name: Resolve diff base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.rebuild_all }}" == true ]]; then
            echo "skip_filter=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=main&status=success&per_page=5" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | .head_sha' | head -1)"
          if [[ -n "$last_release_sha" && "$last_release_sha" != "$GITHUB_SHA" ]] \
            && git merge-base --is-ancestor "$last_release_sha" HEAD 2>/dev/null; then
            echo "base=$last_release_sha" >> "$GITHUB_OUTPUT"
            echo "Diff since last successful production release ($last_release_sha)"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
            echo "Diff since previous commit (no prior release run found)"
          else
            echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "skip_filter=false" >> "$GITHUB_OUTPUT"
      - id: filter
        if: steps.diff_base.outputs.skip_filter != 'true'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          base: ${{ steps.diff_base.outputs.base }}
          ref: ${{ github.sha }}
          filters: |
            shared:
              - 'infra/docker/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'packages/**'
              - 'compose.yaml'
              - 'infra/compose/**'
            web:
              - 'apps/web/**'
            cms:
              - 'apps/cms/**'
            commerce:
              - 'apps/commerce/**'
            api:
              - 'apps/api/**'
            worker:
              - 'apps/worker/**'
            migrator:
              - 'packages/db/**'
              - 'apps/cms/migrations/**'
              - 'apps/commerce/migrations/**'
      - id: plan
        name: Plan image builds
        env:
          REBUILD_ALL: ${{ inputs.rebuild_all }}
          SHARED: ${{ steps.filter.outputs.shared }}
          WEB: ${{ steps.filter.outputs.web }}
          CMS: ${{ steps.filter.outputs.cms }}
          COMMERCE: ${{ steps.filter.outputs.commerce }}
          API: ${{ steps.filter.outputs.api }}
          WORKER: ${{ steps.filter.outputs.worker }}
          MIGRATOR: ${{ steps.filter.outputs.migrator }}
          SKIP_FILTER: ${{ steps.diff_base.outputs.skip_filter }}
        run: |
          set -euo pipefail
          want() {
            local flag="$1"
            [[ "$REBUILD_ALL" == true || "$SKIP_FILTER" == true || "$SHARED" == true || "$flag" == true ]]
          }
          declare -A build=(
            [web]=false [cms]=false [commerce]=false [api]=false [worker]=false [migrator]=false
          )
          for app in web cms commerce api worker migrator; do
            upper="${app^^}"
            if want "${!upper}"; then
              build[$app]=true
            fi
          done
          any=false
          for app in web cms commerce api worker migrator; do
            [[ "${build[$app]}" == true ]] && any=true
          done
          if [[ "$any" != true ]]; then
            echo "No path changes in HEAD; building all images for this release."
            for app in web cms commerce api worker migrator; do
              build[$app]=true
            done
          fi
          json='{'
          pull=()
          matrix_items=()
          first=true
          for app in web cms commerce api worker migrator; do
            [[ "$first" == true ]] || json+=','
            first=false
            if [[ "${build[$app]}" == true ]]; then
              json+="\"$app\":true"
              pull+=("$app")
              matrix_items+=("$app")
            else
              json+="\"$app\":false"
            fi
          done
          json+='}'
          build_matrix='['
          mfirst=true
          for app in "${matrix_items[@]}"; do
            [[ "$mfirst" == true ]] || build_matrix+=','
            mfirst=false
            build_matrix+="\"$app\""
          done
          build_matrix+=']'
          {
            echo "apps<<EOF"
            echo "$json"
            echo "EOF"
            echo "pull_apps=$(IFS=,; echo "${pull[*]}")"
            echo "build_matrix=$build_matrix"
          } >> "$GITHUB_OUTPUT"
          echo "Build plan: $json"

  build:
    name: Build production image ${{ matrix.app }}
    needs: [preflight, changes]
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
      security-events: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: namespace
        name: Normalize image namespace
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./infra/docker/Dockerfile
          push: true
          tags: ${{ steps.namespace.outputs.prefix }}/${{ matrix.app }}:production-sha-${{ github.sha }}
          build-args: |
            APP=${{ matrix.app }}
            BUILD_SITE_URL=${{ vars.PRODUCTION_SITE_URL }}
            BUILD_API_URL=${{ vars.PRODUCTION_API_URL }}
            BUILD_CMS_URL=${{ vars.PRODUCTION_CMS_URL }}
            BUILD_MEDIA_URL=${{ vars.PRODUCTION_MEDIA_URL }}
            BUILD_CHECKOUT_ENABLED=${{ vars.PRODUCTION_CHECKOUT_ENABLED != '' && vars.PRODUCTION_CHECKOUT_ENABLED || 'true' }}
          cache-from: type=gha,scope=production-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.app }}
          provenance: false
          sbom: false
      # Scan on the same runner as the build. A separate security-gate job often sat
      # queued for 15+ minutes on private repos and was cancelled before deploy ran.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.namespace.outputs.prefix }}/${{ matrix.app }}:production-sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Deploy to production
    needs: [preflight, changes, build]
    if: |
      always() &&
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.PRODUCTION_SITE_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          DEPLOY_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: production-sha-${{ github.sha }}
          CERA_PULL_APPS: ${{ needs.changes.outputs.pull_apps }}
        run: |
          set -euo pipefail
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "::error::$name is required"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cleanup_registry_auth() {
            ssh "$DEPLOY_USER@$DEPLOY_HOST" 'docker logout ghcr.io >/dev/null 2>&1 || true'
          }
          trap cleanup_registry_auth EXIT
          printf '%s' "$DEPLOY_GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"
          tar -cf - compose.yaml infra/compose infra/caddy infra/postgres infra/erpnext infra/scripts infra/systemd | \
            ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/cera && tar -xf - -C /opt/cera'
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash /opt/cera/infra/scripts/ensure-production-checkout-env.sh /opt/cera/.env'
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/cera && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' CERA_PULL_APPS='$CERA_PULL_APPS' bash infra/scripts/deploy.sh production"
      - name: Smoke test
        env:
          SMOKE_ORIGIN: ${{ vars.PRODUCTION_SITE_URL }}
          SMOKE_API: ${{ vars.PRODUCTION_API_URL }}
        run: bash infra/scripts/smoke-test.sh
