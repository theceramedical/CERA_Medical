name: Browser suites

# Optional: Playwright a11y + e2e (~15 min). Not on every push — run before large
# frontend releases or when changing CSP, shell, or WCAG-sensitive UI.
#
#   gh workflow run "Browser suites" --ref main

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "10.28.2"

jobs:
  browser:
    name: Browser suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared runtime packages
        run: pnpm --filter '@cera/observability...' build
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run accessibility and E2E suites
        run: pnpm --filter web test:browser
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
