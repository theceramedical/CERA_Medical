name: CI

# Every action is pinned to a full commit SHA, not a tag. A tag is mutable: an
# attacker who compromises an action repository can repoint v4 at malicious code
# and it runs with this workflow's token. The version in the trailing comment is
# for humans, and Dependabot updates both together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default to no permissions and grant per job. The default token is otherwise
# write-capable on contents, which a lint job has no business holding.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "10.28.2"

jobs:
  # ---------------------------------------------------------------------------
  # One install, shared by everything downstream. Splitting the jobs gives a
  # readable failure - "typecheck failed" rather than "the build step failed" -
  # and lets them run in parallel.
  # ---------------------------------------------------------------------------
  setup:
    name: Install and cache
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails rather than silently resolving a new version,
        # which is what makes the build reproducible (PRD 10).
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint and format
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared runtime packages
        run: pnpm --filter '@cera/observability...' build
      - run: pnpm typecheck

  test:
    name: Unit and contract tests
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Real services rather than mocks. A mocked PostgreSQL cannot catch a
    # constraint violation or a migration that fails on existing data.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: cera_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      valkey:
        image: valkey/valkey:9.1.2-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://postgres:ci_only_not_a_real_secret@localhost:5432/cera_test
      VALKEY_URL: redis://localhost:6379/0
      NODE_ENV: test
      CERA_ENV: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared runtime packages
        run: pnpm --filter '@cera/observability...' build

      # Applied before the tests, not by them. The constraint and trigger suite in
      # @cera/db asserts against the real schema, so an unmigrated database would
      # report forty "relation does not exist" failures instead of one clear one.
      - name: Apply migrations
        run: pnpm migrate

      - name: Verify migrations are re-runnable
        # A second run must be a no-op. A migration that fails on its own output
        # breaks every redeploy, and that is cheaper to catch here than in a
        # release.
        run: pnpm migrate && pnpm migrate:status

      - name: Seed, and verify seeding is idempotent
        # The fixtures are validated against their Zod schemas by the unit tests, but
        # only a real INSERT proves they satisfy the database: the check constraints,
        # the foreign keys, and the column widths are not expressible in Zod. A
        # fixture that violates one of them would otherwise fail for the first
        # developer who ran `pnpm seed`, not here.
        #
        # Run twice for the same reason migrations are: a seed that fails on its own
        # output makes "reset the database" the normal response to any error.
        run: pnpm seed && pnpm seed && pnpm seed:reset

      - name: Run tests
        run: pnpm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: "**/coverage/"
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Contract compatibility. The web app, the API, and the worker deploy as separate
  # containers, so during every deploy an old client talks to a new server. A field
  # removed from a response schema is not a compile error anywhere - both sides
  # type-check against their own copy - it is a runtime failure in whichever client
  # has not been replaced yet. This is the only check that sees it.
  #
  # Additive changes pass silently, by design. A gate that flagged every change is a
  # gate that gets switched off.
  # ---------------------------------------------------------------------------
  contracts:
    name: Contract compatibility
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check for breaking contract changes
        run: pnpm contracts:check

  # ---------------------------------------------------------------------------
  # Schema drift. Asserts that the committed migrations describe the committed
  # schema, which is the failure this catches: someone edits a Drizzle table,
  # tests pass locally against a database they migrated by hand, and the migration
  # SQL is never generated. The next clean deploy then builds the old schema.
  # ---------------------------------------------------------------------------
  migrations:
    name: Migration drift
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the journal for collisions
        run: pnpm migrate:drift

      - name: Generate and assert nothing changed
        run: |
          pnpm migrate:generate
          if ! git diff --quiet --exit-code -- packages/db/drizzle; then
            echo "::error::The Drizzle schema has changed without a generated migration."
            echo "Run 'pnpm migrate:generate' and commit the result."
            git --no-pager diff --stat -- packages/db/drizzle
            exit 1
          fi
          # Also catches a brand-new migration file, which `git diff` alone misses
          # because it is untracked rather than modified.
          untracked="$(git ls-files --others --exclude-standard -- packages/db/drizzle)"
          if [ -n "$untracked" ]; then
            echo "::error::Generating produced new migration files that are not committed:"
            echo "$untracked"
            exit 1
          fi
          echo "No schema drift."

  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages with non-secret dashboard placeholders
        run: pnpm build
        env:
          DB_HOST: postgres
          DB_NAME: build_only
          DB_USERNAME: build_only
          DB_PASSWORD: build_only
          VALKEY_HOST: valkey
          SUPERADMIN_USERNAME: build_only
          SUPERADMIN_PASSWORD: build_only
          COOKIE_SECRET: build_only
          CERA_ENV: production
          STORAGE_DRIVER: local
          PAYLOAD_SECRET: ci-build-placeholder-not-a-production-secret
          CMS_DATABASE_URL: postgres://build_only:build_only@127.0.0.1:5432/build_only

  # ---------------------------------------------------------------------------
  # The suites that need a real browser. Both are required gates rather than advisory
  # reports: the product commits to WCAG 2.2 AA (PRD QA-1102), and the CSP check is
  # guarding against a failure that is invisible without a browser enforcing the policy.
  #
  # One job for both because the expensive part is installing Chromium, and doing that
  # twice to keep the report headings tidy is a minute of CI per push for no benefit.
  #
  # The accessibility rules that matter most here - colour contrast, target size,
  # reflow - all depend on layout, and jsdom has none, which is why this cannot fold
  # into the unit job. The component-level sweep in packages/ui covers the rules that
  # do work without layout; this covers the rest, on assembled pages.
  #
  # The visual suite is deliberately absent. Playwright tags screenshot baselines with
  # the platform that produced them, and they are committed from a Windows workstation
  # (`-visual-win32.png`), so a Linux runner would find no baseline and write one rather
  # than compare against it - a job that passes unconditionally. Enforcing it in CI means
  # generating Linux baselines inside the Playwright container, which Phase 14 does along
  # with the cross-browser matrix. Until then `pnpm test:visual` is a local gate and the
  # committed images are the reviewable record of how the pages looked.
  # ---------------------------------------------------------------------------
  browser:
    name: Browser suites
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared runtime packages
        run: pnpm --filter '@cera/observability...' build

      - name: Install Chromium
        # `--with-deps` installs the system libraries the browser needs, which are not
        # on the runner image. Chromium only: axe's rules read the DOM and the computed
        # styles rather than engine internals, so a second browser re-derives identical
        # results at triple the runtime. Cross-browser rendering is Phase 14's matrix.
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run accessibility and E2E suites
        # One Playwright invocation: the webServer runs `pnpm build` once, then both
        # projects share the same production server. Two separate commands used to pay
        # for two full Next builds (~minutes each) on every push.
        run: pnpm --filter web test:browser

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # A single required status check. Branch protection references this one job, so
  # adding or renaming a job above never silently un-protects main.
  # ---------------------------------------------------------------------------
  ci-complete:
    name: CI complete
    if: always()
    needs: [lint, typecheck, test, migrations, contracts, browser, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed ($result)."
              exit 1
            fi
          done
          echo "All required jobs succeeded."
