name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm --filter web build

      - name: Start server & snapshot static distribution
        run: |
          node -e "
          const { spawn } = require('child_process');
          const http = require('http');
          const server = spawn('node', ['apps/web/.next/standalone/apps/web/server.js'], {
            env: { ...process.env, PORT: '3005' },
            stdio: 'ignore'
          });
          function check() {
            http.get('http://localhost:3005/about', (res) => {
              if (res.statusCode === 200) {
                const prep = spawn('python3', ['scripts/prepare-cloudflare-pages.py'], { stdio: 'inherit' });
                prep.on('close', (code) => {
                  server.kill();
                  process.exit(code);
                });
              } else {
                setTimeout(check, 300);
              }
            }).on('error', () => setTimeout(check, 300));
          }
          setTimeout(check, 400);
          "

      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/cf-dist --project-name=cera-web --branch=main
