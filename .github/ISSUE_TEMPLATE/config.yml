# Force every issue through a template. A blank issue skips the PRD reference
# and the personal-data warning, which are the two fields that matter most.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/cera-medical/cera-platform/security/advisories/new
    about: Report privately through a security advisory. Never open a public issue for a vulnerability.
